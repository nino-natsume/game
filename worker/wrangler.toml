name = "game-hub"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 游戏资源与存档桶(原 enisia-game-*),合并进 hub 后继续复用,不覆盖任何游戏数据
[[r2_buckets]]
binding = "GAME_ASSETS"
bucket_name = "enisia-game-assets"

[[r2_buckets]]
binding = "GAME_SAVES"
bucket_name = "enisia-game-saves"

# D1 用户数据库:与 enisia 共用同一 users 表(部署前把 database_id 换成实际 ID)
[[d1_databases]]
binding = "DB"
database_name = "enisia-users"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[vars]
HUB_TITLE = "游戏中心"
# 登录已切换至统一 OAuth 授权中心(oauth.107211.xyz),不再使用 GitHub OAuth 直连。
# 如需恢复 GitHub OAuth,请用 wrangler secret put 设置,勿在仓库明文保存密钥。
# GITHUB_CLIENT_ID = "Ov23liPNC4psh46a0hAV"
# GITHUB_CLIENT_SECRET = "..."

# 可选:远程用户中心代理(一般不需要,默认直接读写共用 D1 用户库)
# AUTH_PROXY_URL = "https://enisia.107211.xyz"

# 新增通用站点(R2 类型)时,追加站点桶绑定示例:
# [[r2_buckets]]
# binding = "OTHER_ASSETS"
# bucket_name = "hub-site-other-assets"
#
# [[r2_buckets]]
# binding = "OTHER_SAVES"
# bucket_name = "hub-site-other-saves"